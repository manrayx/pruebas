services:
  - type: web
    name: farmeando-cringe
    runtime: node
    plan: free
    region: ohio
    rootDir: farmeando
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farmeando-cringe-db
          property: connectionString
databases:
  - name: farmeando-cringe-db
    plan: free
    region: ohio
    databaseName: farmeando_cringe_db
    user: farmeando_cringe_db_user
    postgresMajorVersion: "16"
