<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruta Taza · Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  /* Claro y de especialidad: fondo casi blanco, café oscuro solo en texto y detalles, ámbar solo en la acción principal */
  --bg:#F7F6F3; --surface:#FFFFFF; --line:#E9E4DD; --ink:#1E140F; --muted:#6F6259;
  --amber:#E9B872; --amber-ink:#2A1A10; --caramel:#9A5220; --soft:#F2ECE4; --ok:#2F7A4F;
  --display:'Fraunces', Georgia, serif; --body:'DM Sans', system-ui, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#E7E2DB;font-family:var(--body);color:var(--ink);display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--caramel);outline-offset:2px}
.device{width:390px;height:844px;max-height:100%;background:var(--bg);border-radius:44px;border:10px solid #1B1410;position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(30,20,15,.25)}
@media (max-width:500px){body{background:var(--bg);display:block}.device{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}}
header.top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px;background:var(--bg);flex:none}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.01em}
.logo svg{width:24px;height:24px}
.dist{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 24px;scroll-behavior:smooth}
nav.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding:8px 4px 14px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:500}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--ink);font-weight:700}
nav.tabs button.on svg{color:var(--caramel)}
h1{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:15px;font-weight:700;line-height:1.3}
p{line-height:1.5}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:11.5px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.sec{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline}
.link{color:var(--caramel);font-weight:600;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 18px;font-weight:700;font-size:14px;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn-main{background:var(--amber);color:var(--amber-ink)}
.btn-dark{background:var(--ink);color:#fff}
.btn-line{border:1.5px solid var(--ink);color:var(--ink)}
.btn-block{width:100%}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--caramel);white-space:nowrap}
.pill.ad{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:600}
.pill.cup{background:#FBEBD2;color:#7A3F12}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pad{padding:14px}
.ph{width:100%;display:block;object-fit:cover;background:var(--soft)}
.ph-wrap{overflow:hidden;background:var(--soft)}
.ph-wrap img{transform:scale(1.06)}
.hero{display:block;width:100%;text-align:left;border-radius:22px;overflow:hidden;position:relative;height:240px;background:var(--soft)}
.hero img{width:100%;height:100%;object-fit:cover;transform:scale(1.04)}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:18px;background:linear-gradient(transparent,rgba(20,12,8,.78));color:#fff}
.hero .cap h2{color:#fff;font-size:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;text-align:left}
.tile .ph-wrap{height:118px}
.tile .ph{height:100%}
.tile .t{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.cafe-mini{flex:none;width:168px;text-align:left}
.cafe-mini .ph-wrap{height:104px}
.cafe-mini .ph{height:100%}
.listcafe{display:grid;grid-template-columns:96px 1fr;gap:12px;text-align:left;padding:10px}
.listcafe .ph-wrap{border-radius:12px;height:96px}
.listcafe .ph{height:100%}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);margin:2px 0 12px}
.tabsx{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:14px 0 14px}
.tabsx button{padding:0 0 10px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabsx button.on{color:var(--ink);border-color:var(--caramel)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.fact b{display:block;font-size:14px}
.fact span{font-size:11px;color:var(--muted)}
ol.steps{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px;line-height:1.5}
ol.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--caramel);font-weight:700;display:grid;place-items:center;font-size:13px}
ul.ing{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px}
ul.ing li{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding-bottom:8px}
.sponsor{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.brandmark{width:44px;height:44px;border-radius:12px;background:var(--ink);color:var(--amber);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;flex:none}
.map{position:relative;height:190px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#EFEAE2}
.map svg{width:100%;height:100%;display:block}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.pin b{background:var(--ink);color:#fff;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:8px;white-space:nowrap}
.pin i{width:2px;height:8px;background:var(--ink)}
.pin.sel b{background:var(--caramel)}
.stamps{display:flex;gap:8px}
.stamp{width:40px;height:40px;border-radius:50%;border:1.5px dashed #CDBFAF;display:grid;place-items:center}
.stamp.on{border:0;background:var(--amber)}
.stamp svg{width:20px;height:20px}
.prog{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--caramel);border-radius:99px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;font-size:14px;font-weight:600;width:100%}
.opt.sel{border-color:var(--caramel);background:#FDF6EC}
.opt .em{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none}
.opt .em svg{width:22px;height:22px;color:var(--caramel)}
.big{font-family:var(--display);font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1}
.center{text-align:center}
.sheet-bg{position:absolute;inset:0;background:rgba(20,12,8,.45);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--surface);width:100%;border-radius:24px 24px 0 0;padding:22px 20px 28px;display:flex;flex-direction:column;gap:14px;max-height:85%;overflow-y:auto}
.toast{position:absolute;left:20px;right:20px;bottom:92px;background:var(--ink);color:#fff;padding:12px 14px;border-radius:14px;font-size:13px;font-weight:600;z-index:30;text-align:center}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pinpad button{height:52px;border-radius:14px;background:var(--soft);font-size:20px;font-weight:600}
.dots{display:flex;gap:12px;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.dots i.f{background:var(--ink)}
.rank{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.rank:last-child{border:0}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;background:var(--surface);font-size:11.5px;font-weight:600}
.badge .ic{width:40px;height:40px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--amber)}
.badge.off{color:var(--muted)}
.badge.off .ic{background:var(--soft)}
.badge svg{width:20px;height:20px}
input.text{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;font:inherit;font-size:15px;background:var(--surface)}
.timer{font-family:var(--display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.welcome{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.welcome .img{flex:1;min-height:0;position:relative;overflow:hidden}
.welcome .img img{width:100%;height:100%;object-fit:cover}
.welcome .body{padding:24px 24px 30px;display:flex;flex-direction:column;gap:14px}
.splash{background:#1E140F}
.splash .sp-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.splash .sp-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,12,8,.55) 0%,rgba(20,12,8,.1) 40%,rgba(20,12,8,.75) 100%)}
.splash .sp-brand{position:relative;margin-top:96px;display:flex;flex-direction:column;align-items:center;gap:10px;color:#fff}
.splash .sp-brand svg{width:56px;height:56px;color:var(--amber)}
.splash .sp-name{font-family:var(--display);font-weight:700;font-size:54px;letter-spacing:-.02em;line-height:1}
.splash .sp-foot{position:relative;margin-top:auto;padding:0 24px 34px;display:flex;flex-direction:column;gap:16px;text-align:center}
.splash .sp-tag{color:#fff;font-size:16px;opacity:.9}
.radio{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font-weight:600;font-size:15px;width:100%}
.radio.sel{border-color:var(--ink)}
.radio i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.radio.sel i{border:5px solid var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .45s ease-out both}
</style>
</head>

function mapSVG(){
  return `<svg viewBox="0 0 360 190" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <rect width="360" height="190" fill="#EFEAE2"/>
  <path d="M0 0h70c-10 40 8 80-6 120s8 50 0 70H0z" fill="#CFE0E6"/>
  <path d="M64 0c-8 40 10 80-4 120s6 50 0 70" stroke="#D9CDBE" stroke-width="10" fill="none"/>
  ${[30,70,110,150].map(y=>`<path d="M60 ${y}H360" stroke="#fff" stroke-width="6"/>`).join('')}
  ${[120,180,240,300].map(x=>`<path d="M${x} 0V190" stroke="#fff" stroke-width="6"/>`).join('')}
  <path d="M90 180 340 20" stroke="#fff" stroke-width="9"/>

function peruSVG(done){
  const pts=ORIGENES.map(o=>`<g><circle cx="${o.x*3.6}" cy="${o.y*2.6}" r="9" fill="${!done||done.includes(o.n)?'#9A5220':'#CDBFAF'}" opacity=".9"/><text x="${o.x*3.6+13}" y="${o.y*2.6+4}" font-family="DM Sans" font-size="12" font-weight="700" fill="#1E140F">${o.n}</text></g>`).join('');
  return `<svg viewBox="0 0 360 260" aria-label="Regiones cafeteras del Perú" style="width:100%;height:100%">
   <path d="M150 20 205 14 238 40 270 70 262 110 288 150 300 190 312 236 270 248 236 226 190 206 150 170 120 120 98 80 112 46z" fill="#E7DED2" stroke="#D3C6B5" stroke-width="2"/>
   ${pts}</svg>`;
}
function qrSVG(seed){
  let h=0; for(const ch of seed) h=(h*31+ch.charCodeAt(0))>>>0;
  const n=21, cells=[]; let x=h;
  for(let i=0;i<n*n;i++){ x=(x*1103515245+12345)>>>0; cells.push((x>>16)&1); }
  const fin=(r,c)=>(r<7&&c<7)||(r<7&&c>=n-7)||(r>=n-7&&c<7);
  let rects='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){ if(fin(r,c))continue; if(cells[r*n+c]) rects+=`<rect x="${c}" y="${r}" width="1" height="1"/>`; }
  const f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#1E140F"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#1E140F"/>`;
  return `<svg viewBox="-1 -1 23 23" style="width:100%;height:100%" aria-label="Código QR"><rect x="-1" y="-1" width="23" height="23" fill="#fff"/><g fill="#1E140F">${rects}</g>${f(0,0)}${f(n-7,0)}${f(0,n-7)}</svg>`;
}

function render(){
  let h=(location.hash||'#inicio').slice(1);
  let html, tab;
  const m=h.match(/^(receta|cerca|metodo|cafe|cupon|canje|ranking|checkin)-([a-z0-9]+)$/);
  if(h==='recetas-metodos'){ recTab='metodos'; html=P.recetas(); tab='recetas'; }
  else if(m){ html=P[m[1]](m[2]); tab={receta:'recetas',cerca:'recetas',metodo:'recetas'}[m[1]]||(['cafe','cupon','checkin','canje','ranking'].includes(m[1])?'cafeterias':'inicio'); }
  else if(P[h]){ html=P[h](); tab=['quiz','barista','trivia','ruta'].includes(h)?'juegos':h; }
  else { html=P.inicio(); tab='inicio'; }
  view.innerHTML=html; view.scrollTop=0;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $('#distName').textContent=S.dist;
  if(m&&m[1]==='checkin') runCheckin(m[2]);
}

  const t=e.target.closest('button,[data-go]'); if(!t) return;
  const d=t.dataset;
  if(d.go){ if(d.go==='recetas') recTab='recetas'; if(d.go==='quiz'&&quiz&&quiz.paid) quiz=null; if(d.go==='trivia'&&triv&&triv.i>=3) triv=null; go(d.go); return; }
  if(d.toast){ toast(d.toast); return; }
  if(d.filter){ recFilter=d.filter; render(); return; }
  if(d.rtab){ recTab=d.rtab; render(); return; }
  if(d.cf!==undefined){ cafFilter=d.cf||null; render(); return; }
  if(d.origen!==undefined){ openOrigen(+d.origen); return; }
  if(d.fav){ const i=S.favs.indexOf(d.fav); i>=0?S.favs.splice(i,1):S.favs.push(d.fav); save(); render(); toast(i>=0?'Quitada de favoritos':'Guardada en favoritos'); return; }
  if(d.used){ toast('¡Listo! Que lo disfrutes'); go('cafe-'+d.used); return; }
  if(d.checkin){ const today=new Date().toDateString(); if(S.hoy[d.checkin]===today){ toast('Ya sumaste tu sello de hoy aquí. Vuelve mañana.'); return; } go('checkin-'+d.checkin); return; }
  if(d.pin!==undefined){ pinPress(d.pin); return; }
  if(d.q!==undefined){ quiz.sel=+d.q; quiz.v=d.v; render(); return; }
  if(d.qnext){ quiz.a.push(quiz.v); quiz.i++; quiz.sel=null; render(); return; }
  if(d.qreset){ quiz=null; render(); return; }
  if(d.bstart){ startGame(); return; }
  if(d.bk){ game.ch[d.bk]=d.bv; render(); return; }
  if(d.bserve){ serve(); return; }
  if(d.breset){ game=null; render(); return; }
  if(d.ta!==undefined){ triv.ans=+d.ta; if(+d.ta===+d.tc) triv.score++; render(); return; }
  if(d.tnext){ triv.i++; triv.ans=null; if(triv.i>=3){ S.granos+=triv.score*5; S.juegos++; save(); } render(); return; }
  if(d.treset){ triv=null; render(); return; }
  if(d.setdist){ S.dist=d.setdist; save(); render(); return; }
  if(t.id==='distBtn'){ openDist(); return; }
});
document.addEventListener('change',e=>{ if(e.target.id==='apodo'){ const v=e.target.value.trim(); if(v){ S.apodo=v; save(); toast('Apodo actualizado'); } } });
document.addEventListener('submit',e=>{ if(e.target.id==='mailf'){ e.preventDefault(); S.correo=$('#mail').value; save(); render(); toast('Tarjeta guardada con tu correo'); } });

function sheet(html){ const bg=document.createElement('div'); bg.className='sheet-bg'; bg.innerHTML=`<div class="sheet">${html}</div>`; bg.addEventListener('click',ev=>{ if(ev.target===bg||ev.target.closest('[data-close]')) bg.remove(); }); $('#app').appendChild(bg); return bg; }
function openDist(){
  const ds=['Barranco','Miraflores','San Isidro','Surco','Lince','Jesús María'];
  const bg=sheet(`<h2>¿Dónde sueles tomar café?</h2><div class="stack" style="gap:8px">${ds.map(x=>`<button class="radio ${x===S.dist?'sel':''}" data-d="${x}">${x}<i></i></button>`).join('')}</div><button class="btn btn-main btn-block" data-close="1">Listo</button>`);
  bg.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>{ S.dist=b.dataset.d; save(); bg.remove(); render(); }));
}
function openOrigen(i){
  const o=ORIGENES[i];
  sheet(`<p class="xs muted">Región cafetera</p><h1>${o.n}</h1>
    <div class="grid2"><div class="fact"><b>${o.alt}</b><span>altitud</span></div><div class="fact"><b>${o.notas}</b><span>notas de sabor</span></div></div>
    <div class="sponsor"><div class="brandmark">CA</div><div style="flex:1"><p class="xs muted">Café de esta región</p><h3>Café Andino · ${o.n}</h3></div><span class="pill ad">Auspicia</span></div>
    <button class="btn btn-main btn-block" data-close="1" data-toast="Aquí se abre la tienda de la marca">Comprar este café</button>`);
}
function runCheckin(id){
  const c=C(id), box=$('#ck');
  if(S.hoy[id]===new Date().toDateString()){ box.innerHTML=`<h2 style="margin-top:60px">Ya sumaste tu sello de hoy en ${c.n}</h2><p class="small muted">Se suma un sello por día. Vuelve mañana.</p><button class="btn btn-dark btn-block" data-go="cafe-${id}">Volver</button>`; return; }
  setTimeout(()=>{ if(!box.isConnected) return; box.innerHTML=`<div style="width:90px;height:90px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin-top:60px"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#9A5220" stroke-width="2"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></div><h2>Verificando que estás en ${c.n}…</h2><p class="small muted">Usamos la ubicación del celular solo para validar la visita.</p>`; },1100);
  setTimeout(()=>{ if(!box.isConnected) return;
    S.sellos[id]=Math.min(5,(S.sellos[id]||0)+1); S.granos+=10; S.hoy[id]=new Date().toDateString(); save();
    const n=S.sellos[id];
    box.innerHTML=`<p class="big pop" style="margin-top:30px;color:var(--caramel)">+1 sello</p>
      <div class="card pad stack" style="width:100%;margin-top:10px"><h3>${c.n}</h3>${stampsHTML(n)}<p class="small muted">${n>=5?'¡Completaste tu tarjeta!':`${n} de 5 · Te ${5-n===1?'falta 1':'faltan '+(5-n)} para tu café gratis`}</p></div>
      <p class="small" style="color:var(--caramel);font-weight:700">+10 granos de oro</p>
      ${n>=5?`<button class="btn btn-main btn-block" data-go="canje-${id}">Canjear mi café gratis</button>`:`<button class="btn btn-dark btn-block" data-go="cafe-${id}">Listo</button>`}`; },2400);
}
function pinPress(k){
  if(k==='⌫') pinVal=pinVal.slice(0,-1); else if(pinVal.length<4) pinVal+=k;
  document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('f',i<pinVal.length));
  if(pinVal.length===4){
    const id=location.hash.split('-')[1];
    if(pinVal==='1234'){ S.sellos[id]=0; S.canjes.push(id); save();
      setTimeout(()=>{ view.innerHTML=`<div class="center stack" style="align-items:center;padding-top:70px;gap:12px"><span class="stamp on pop" style="width:84px;height:84px;background:var(--ok)"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg></span><h1>Canjeado</h1><p class="muted">${C(id).n} · ${new Date().toLocaleString('es-PE',{dateStyle:'medium',timeStyle:'short'})}</p><p class="small muted">Tu tarjeta vuelve a empezar. ¡Que lo disfrutes!</p><button class="btn btn-dark btn-block" data-go="cafe-${id}">Volver a la cafetería</button></div>`; },250);
    } else { setTimeout(()=>{ pinVal=''; document.querySelectorAll('#dots i').forEach(d=>d.classList.remove('f')); toast('PIN incorrecto. Pídele al barista que lo intente de nuevo.'); },250); }
  }
}
let gt=null;
function startGame(){ game={i:0,score:0,t:60,ch:{},done:false}; clearInterval(gt);
  gt=setInterval(()=>{ if(!game||game.done){clearInterval(gt);return;} game.t--; const el=$('#btimer'); if(el) el.textContent='0:'+String(Math.max(0,game.t)).padStart(2,'0'); if(game.t<=0){ endGame(); } },1000); render(); }
function serve(){ const ORD=[{base:'Espresso',leche:'Sí',extra:'Nada'},{base:'Espresso',leche:'No',extra:'Tónica'},{base:'Cold brew',leche:'No',extra:'Hielo'}]; const ok=ORD[game.i], ch=game.ch;
  const good=ch.base===ok.base&&ch.leche===ok.leche&&ch.extra===ok.extra; if(good) game.score++; toast(good?'¡Pedido correcto!':'Ese no era el pedido');
  game.i++; game.ch={}; if(game.i>=3) endGame(); else render(); }
function endGame(){ clearInterval(gt); if(game.done) return; game.done=true; S.granos+=game.score*5; S.juegos++; save(); if(location.hash==='#barista') render(); }

/* Bienvenida (solo la primera vez) */
function welcome(){
  const first=!S.welcomed;
  const w=document.createElement('div'); w.className='welcome splash';
  w.innerHTML=`${img('hero','Taza de café con arte latte sobre una mesa de madera','sp-img')}
  <div class="sp-shade"></div>
  <div class="sp-brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3.5c0 1 1 1.3 1 2.3M12 3.5c0 1 1 1.3 1 2.3"/></svg>
    <p class="sp-name">Ruta Taza</p>
  </div>
  <div class="sp-foot">
    <p class="sp-tag">Todo el café, y dónde tomarlo</p>
    <button class="btn btn-main btn-block" id="wgo">Empezar ${I.arrow}</button>
  </div>`;
  $('#app').appendChild(w);
  w.querySelector('#wgo').addEventListener('click',()=>{ w.remove(); if(first){ S.welcomed=true; save(); openDist(); } });
}
render(); welcome();
</script>
</body>
</html>
